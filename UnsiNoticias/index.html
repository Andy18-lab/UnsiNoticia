<head>

    <style>
        body {
            margin: 0;
            font-family: Georgia, sans-serif;
            background-color: #FFFDF9; 
        }

        .header {

            color: white;

        .seccion-boton{
            background-color: azure;
            border: 2px ;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(3, 25, 38, 0.1);

        }

</head>
<body>
    <div class="header">
        <h1>UnsiNoticias</h1>
    </div>
    <div class="seccion-completa">
        <div class="seccion-boton">

        </div>
    </div>

</body>
</html>
